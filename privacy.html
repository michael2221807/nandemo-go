    <h1>隐私政策</h1><p class="date">生效日期：2026 年 11 月 4 日</p>
    <p>南丁猫自贩机（Nandemo Go: Idle Vending）由 Hanlai Chen 开发。本政策适用于这款游戏的 iPhone 版、Android 版和本网站。</p>
    <h2>应用收集什么</h2><p>我们什么都不收集。应用没有账号、没有广告、没有数据统计和追踪，不会把你的任何数据发给我们。</p><p>Android 版的应用内购买用的是 Google 的 Google Play 结算库（Play Billing Library）。这个组件会把它自己的诊断信息（比如购买功能的调用情况和出错记录）发给 Google，供 Google 维护和改进付款服务。这部分由 Google 按 <a href="https://policies.google.com/privacy">Google 隐私权政策</a>处理，我们拿不到。</p>
    <h2>进度存在哪里</h2><p>iPhone 版：游戏进度保存在你的 iPhone 上。如果开启了 iCloud，Apple 的 iCloud 也会在你自己的 iCloud 账户里保存一份，换一台登录同一 Apple 账户的 iPhone 可以接着玩。我们看不到这些数据。</p><p>Android 版：游戏进度保存在你的手机上。如果手机开启了 Google 备份，Android 会把它连同其他应用数据一起备份到你自己的 Google 账号，换手机恢复后可以接着玩。我们看不到这些数据。</p>
    <h2>购买</h2><p>应用内购买在 iPhone 上由 Apple 通过 App Store 处理，在 Android 上由 Google Play 处理，我们拿不到你的付款信息。「恢复购买」只是向 Apple 或 Google Play 查询你买过哪些项目。</p>
    <h2>通知</h2><p>提醒（比如整条街卖空了、来了一只新猫）是在你的手机上本地安排的通知，只有你允许后才会出现，随时可以在手机的「设置」里关闭。没有服务器，也没有远程推送。</p>
    <h2>小组件</h2><p>（只有 iPhone 版有）主屏幕小组件读取的是你 iPhone 上的游戏数据，不会离开设备。</p>

    <h2>联系</h2><p><a href="mailto:${MAIL}">${MAIL}</a></p>` },

    <p>なんでも自販機（Nandemo Go: Idle Vending）は Hanlai Chen が開発しています。このポリシーは iPhone 版・Android 版のアプリと本サイトに適用されます。</p>

    <h2>進行データの保存場所</h2><p>iPhone 版：ゲームの進行は iPhone に保存されます。iCloud がオンの場合は、Apple の iCloud があなた自身の iCloud アカウントにも保存し、同じ Apple アカウントの別の iPhone で続きを遊べます。私たちはこのデータを見られません。</p><p>Android 版：ゲームの進行はスマートフォンに保存されます。Google のバックアップがオンの場合は、Android がほかのアプリのデータと一緒にあなた自身の Google アカウントにバックアップし、新しい端末に復元すると続きを遊べます。私たちはこのデータを見られません。</p>
    <h2>購入</h2><p>アプリ内課金は、iPhone では Apple が App Store を通じて、Android では Google Play が処理し、支払い情報が私たちに届くことはありません。「購入を復元」は、購入済みの項目を Apple または Google Play に問い合わせるだけです。</p>
    <h2>通知</h2><p>お知らせ（通り全体が売り切れた、新しい猫が来た など）はスマートフォン上でスケジュールされるローカル通知です。許可した場合のみ届き、いつでも端末の「設定」でオフにできます。サーバーもリモートプッシュもありません。</p>

  'en': { title: 'Privacy Policy · Nandemo Go', name: 'Nandemo Go', home: 'Home', other: 'Support & contact', body: `
    <h1>Privacy Policy</h1><p class="date">Effective November 4, 2026</p>
    <p>Nandemo Go: Idle Vending is made by Hanlai Chen. This policy covers the iPhone and Android apps and this website.</p>
    <h2>What the app collects</h2><p>We collect nothing. The app has no accounts, no ads, no analytics and no tracking, and it never sends your data to us.</p><p>On Android, in-app purchases go through Google’s Google Play Billing Library. That component sends Google its own diagnostic information (such as how its purchase functions were called, and any errors) so that Google can maintain and improve its payment service. Google handles it under the <a href="https://policies.google.com/privacy">Google Privacy Policy</a>; we never receive it.</p>
    <h2>Where your progress is kept</h2><p>On iPhone, your game progress is saved on your iPhone. If iCloud is on, Apple’s iCloud also keeps a copy in your own iCloud account, so another iPhone signed in to the same Apple Account can carry on. We cannot see it.</p><p>On Android, your game progress is saved on your phone. If Google backup is on, Android backs it up with your other app data to your own Google Account, so you can carry on after restoring to a new phone. We cannot see it.</p>
    <h2>Purchases</h2><p>In-app purchases are handled by Apple through the App Store on iPhone, and by Google Play on Android. We never receive your payment details. Restore purchases only asks Apple or Google Play which items you own.</p>
    <h2>Notifications</h2><p>Reminders (for example, that the whole street has sold out, or that a new cat came by) are local notifications scheduled on your phone. They appear only if you allow them, and you can turn them off at any time in your phone’s Settings app. There is no server and no remote push.</p>
    <h2>Widgets</h2><p>(iPhone only) Home Screen widgets read the game’s data on your iPhone. Nothing leaves the device.</p>
    <h2>Children</h2><p>The app collects no personal information from anyone, including children.</p>
    <h2>This website</h2><p>This website uses no cookies and no analytics. Its fonts come from Google Fonts and the App Store badge from Apple; like any web request, these receive your IP address.</p>
    <h2>Changes</h2><p>If this policy changes, this page will be updated and the date above changed.</p>
    <h2>Contact</h2><p><a href="mailto:${MAIL}">${MAIL}</a></p>` }
